<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#1f2a33;--muted:#5d6b73;--accent:#5f8579;--blush:#d8a1a6;--line:#dbe3e1;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b20;--card:#1d272d;--ink:#eef2f1;--muted:#9aa9ae;--accent:#8fb5a8;--blush:#d8a1a6;--line:#2c3a41}}
:root[data-theme="dark"]{--bg:#141b20;--card:#1d272d;--ink:#eef2f1;--muted:#9aa9ae;--accent:#8fb5a8;--blush:#d8a1a6;--line:#2c3a41}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
.hero{text-align:center;padding:56px 24px 36px;background:linear-gradient(180deg,rgba(95,133,121,.16),transparent)}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--accent);font-weight:500}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.8rem,13vw,4.6rem);line-height:1;margin:.35em 0 .1em}
.date{font-family:var(--serif);font-size:1.5rem;letter-spacing:.04em}
.place{color:var(--muted);font-size:1rem;margin-top:6px}
.clock{display:flex;justify-content:center;gap:10px;margin:30px auto 0;max-width:230px}
.clock div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 4px}
.clock b{display:block;font-family:var(--serif);font-size:2rem;font-weight:500;line-height:1}
.clock small{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.msg{font-family:var(--serif);font-size:1.4rem}
.from{font-family:var(--serif);font-size:clamp(.95rem,4.6vw,1.35rem);line-height:1.35;color:var(--ink);white-space:nowrap;margin:20px auto 0}
h2{font-family:var(--serif);font-weight:500;font-size:1.9rem;text-align:center;margin:36px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin:0 0 16px}
.wrap{max-width:760px;margin:0 auto;position:relative}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 24px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 84%;max-width:340px;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 8px 24px -14px rgba(31,42,51,.35)}
.card .ico{font-size:1.5rem}
.card h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:6px 0 10px}
.card p{margin:0 0 8px;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.row:last-of-type{border:0}.row b{font-weight:500}.row span{color:var(--muted);text-align:right}
.map{height:110px;border-radius:14px;margin:6px 0 14px;background:
 linear-gradient(90deg,transparent 48%,var(--line) 48% 52%,transparent 52%),
 linear-gradient(0deg,transparent 40%,var(--line) 40% 44%,transparent 44%),
 linear-gradient(135deg,rgba(95,133,121,.25),rgba(216,161,166,.25));display:flex;align-items:center;justify-content:center;font-size:2rem}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-size:.85rem;font-weight:500;padding:10px 18px;border-radius:999px}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.stay{padding:10px 0;border-bottom:1px solid var(--line)}.stay:last-of-type{border:0}
.stay b{font-weight:500;display:block}.stay small{color:var(--muted)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:4px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:.25s}
.dots button.on{background:var(--accent);width:22px;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:36px 24px 30px}
.stay a{color:var(--accent);font-size:.82rem;text-decoration:none;font-weight:500}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kids{filter:invert(1) hue-rotate(180deg)}}
:root[data-theme="dark"] .kids{filter:invert(1) hue-rotate(180deg)}
.stage{position:relative;width:min(380px,94%);height:300px;margin:0 auto 18px}
.hall{position:absolute;inset:0;margin:auto;width:100%;height:auto;max-height:100%;color:var(--accent);animation:hallK 14s linear infinite}
.kidwrap{position:absolute;inset:0;margin:auto;width:212px;height:300px;opacity:0;animation:kidsK 14s linear infinite}
.kids{display:block;width:212px;height:300px}
.tag{position:absolute;transform:translateX(-50%);font-family:'Gochi Hand','Comic Sans MS',cursive;font-size:20px;line-height:1;white-space:nowrap;color:var(--ink)}
.dr{stroke-dasharray:1 1;stroke-dashoffset:1.02;animation:draw 14s linear infinite}
@keyframes hallK{0%,42%{opacity:1}50%,100%{opacity:0}}
@keyframes kidsK{0%,42%{opacity:0}50%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1.02}22%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hall{display:none}.kidwrap{animation:none;opacity:1}.dr{animation:none}}
.invite{max-width:300px;margin:14px auto 0;font-family:var(--serif);font-size:1.3rem;line-height:1.35}
.invite b{font-weight:600;white-space:nowrap}
.lab{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{display:block;width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:4px 0 12px}
.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.opts{display:flex;gap:8px;margin-bottom:14px}
.opts label{flex:1;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:12px;font-size:.88rem;cursor:pointer;background:var(--bg)}
.opts input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
button.btn{border:0;font-family:inherit;cursor:pointer}
.card .note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.names{display:block;font-size:2.4rem;font-weight:500;color:var(--accent);line-height:1.1;margin:6px 0 8px}
.when{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.03em;margin:10px 0 0}
.blurb{font-family:var(--serif);font-size:1.2rem;line-height:1.35;color:var(--muted);max-width:300px;margin:18px auto 0}
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock .box{width:100%;max-width:300px}
.lock h1{font-size:clamp(2.2rem,11vw,3rem);margin:.1em 0 .15em}
.lock p{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.lock .in{text-align:center;margin:0 0 12px}
.lock .btn{width:100%;padding:13px 18px;font-size:.95rem}
.lock .err{color:#b3544f;min-height:1.4em;font-size:.85rem;margin:12px 0 0}
</style>
</head>
<body>
<main class="lock" id="lock"><div class="box">
<h1>Hello</h1>
<p>Please enter the password from your invitation.</p>
<input class="in" id="pw" type="password" placeholder="Password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Password">
<button class="btn" id="go" type="button">Open</button>
<div class="err" id="err" role="alert"></div>
</div></main>
